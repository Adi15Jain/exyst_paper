name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # --- Backend Tests ---
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: exyst_test
          POSTGRES_USER: exyst
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -e ".[dev]"

      - name: Lint with Ruff
        working-directory: ./backend
        run: ruff check app/

      - name: Type check with MyPy
        working-directory: ./backend
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://exyst:test_password@localhost:5432/exyst_test
          GROQ_API_KEY: test_key
          JWT_SECRET_KEY: test_secret_key_for_ci
          DEBUG: true
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  # --- Frontend Build ---
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Build
        working-directory: ./frontend
        run: npm run build

  # --- Docker Build ---
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Verify containers start
        run: |
          docker compose up -d postgres redis
          sleep 5
          docker compose ps
