[project]
name = "exyst-backend"
version = "2.0.0"
description = "AI-Powered Exam Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Adi Jain"},
]

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # --- AI / LLM (Google AI Studio) ---
    "google-genai>=1.0.0",
    "pdfminer.six>=20231228",
    "PyMuPDF>=1.24.0",
    "chromadb>=0.5.0",

    # --- Auth & Security ---
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0",

    # --- Configuration ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",

    # --- Logging ---
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# These modules hold multi-line LLM prompt templates whose lines are part of the
# prompt text and cannot be wrapped without changing what the model receives.
"app/ai/pipelines/classifier.py" = ["E501"]
"app/ai/pipelines/pattern_analyzer.py" = ["E501"]
"app/ai/pipelines/predictor.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
