# ==============================================
# Exyst — Docker Compose Configuration
# ==============================================
# Run: docker compose up --build
# ==============================================

services:
  # --- PostgreSQL Database ---
  postgres:
    # pgvector image (drop-in Postgres 16) — the RAG store needs the `vector`
    # extension, which stock postgres images don't ship.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: exyst_db
      POSTGRES_USER: exyst
      POSTGRES_PASSWORD: exyst_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exyst -d exyst_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- FastAPI Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://exyst:exyst_password@postgres:5432/exyst_db
      - DEBUG=true
      - CORS_ORIGINS=["http://localhost:3000"]
      # Pass the Gemini key through from the host environment (or backend/.env).
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Next.js Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  backend_uploads:
